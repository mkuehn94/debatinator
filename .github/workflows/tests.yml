name: Dataset and review checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/build-shared-dataset.py --metadata-only --check
      - run: python scripts/render-fallacy-catalog.py --check
      - run: python scripts/render-fallacy-discovery.py --check
